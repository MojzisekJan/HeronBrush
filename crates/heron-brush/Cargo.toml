[package]
name = "heron-brush"
description = "Heron Brush, the level editor: egui + eframe frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["wgpu"]
# Live sessions over the open internet, off by default because iroh's tree is about
# half of both the binary and a cold build. A default build still hosts and joins
# sessions on the local network over TCP; only the internet route needs this.
iroh = ["editor_core/iroh"]
# The window and the 3D view on wgpu (Metal/Vulkan/DX12) with render_wgpu; see
# docs/renderer-wgpu.md. On by default; `--no-default-features` builds the old GL view,
# kept as a fallback until wgpu has been tested on every platform.
# eframe's own `wgpu` feature turns on egui-wgpu's defaults, and with them wgpu's WebGL
# backend, which brings wgpu-core and naga into the web module (about 2 MB of code). The
# browser draws WebGL with the GL view instead, so the backends are chosen per target
# below: the desktop keeps egui-wgpu's defaults, the web gets WebGPU alone.
wgpu = ["eframe/wgpu_no_default_features", "dep:egui-wgpu", "dep:wgpu", "dep:render_wgpu"]

[dependencies]
# std::time, with an Instant and a SystemTime that work in the browser too.
web-time = "1"
rustc-hash = "2"
editor_core = { path = "../editor_core" }
# The controls drawn in the manner of the system (macOS, WinUI), and text centred on its capitals.
# The controls in the manner of the system: its own project. To work on it beside the
# editor, point a `[patch."https://github.com/MojzisekJan/egui_native_look"]` at a checkout.
egui_native_look = { git = "https://github.com/MojzisekJan/egui_native_look" }
map_model = { path = "../map_model" }
geometry_math = { path = "../geometry_math" }
render = { path = "../render" }
render_wgpu = { path = "../render_wgpu", optional = true }
scene_export = { path = "../scene_export" }
glow = "0.18.0"
# The web build's exports are zip archives (src/zip.rs); both are in the tree already, under png.
flate2 = "1"
crc32fast = "1"
# The inspector reads the selection report (editor_core::selection_report) as JSON.
serde_json = "1"
# The engine logos in the export window are PNGs.
image = { version = "0.25.10", default-features = false, features = ["png"] }

eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.36.2", default-features = false, features = ["svg"] }
# Icons beside the menu items, drawn as glyphs of a font so they take the text colour.
egui-phosphor = "0.14.0"

[target.'cfg(not(any(target_os = "android", target_arch = "wasm32")))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wayland", "x11", "accesskit"] }
# Native file choosers: the system dialog on Windows and macOS, the desktop portal on
# Linux, so choosing a file needs no toolkit libraries. Android has its own in-app
# browser (src/file_dialog.rs).
rfd = "0.17"

# Android: winit's NativeActivity backend, which needs no Java code of its own (eframe's
# accesskit support needs GameActivity, so it stays desktop-only). See docs/android.md.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["android-native-activity"] }
winit = { version = "0.30.13", default-features = false }
log = "0.4"
android_logger = "0.15"

# The web build: eframe's WebRunner on a <canvas>, entered from crates/heron-brush-web.
# See docs/web.md.
# The desktop and Android keep egui-wgpu's defaults, as eframe's `wgpu` feature gave them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui-wgpu = { version = "0.36.2", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
egui-wgpu = { version = "0.36.2", optional = true, default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
wgpu = { version = "30.0", optional = true, default-features = false, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "WebGl2RenderingContext"] }
log = "0.4"

[lints]
workspace = true

[dev-dependencies]
editor_core = { path = "../editor_core", features = ["test-support"] }
