<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Heron Brush</title>
  <link data-trunk rel="rust" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int" data-initializer="loader.mjs">
  <link data-trunk rel="rust" href="../heron-brush-export-web/Cargo.toml" data-type="worker" data-bindgen-target="web" data-wasm-opt="s" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int">
  <link data-trunk rel="copy-file" href="playtest_worker.mjs">
  <link data-trunk rel="icon" href="../heron-brush/assets/app-icons/heron-brush.png">
  <link data-trunk rel="copy-file" href="../heron-brush/assets/app-icons/heron-brush.png">
  <link data-trunk rel="copy-file" href="play.html">
  <link data-trunk rel="copy-file" href="playtest.mjs">
  <link data-trunk rel="copy-file" href="../heron-brush/src/playtest_protocol.js">
  <link data-trunk rel="copy-dir" href="vendor">
  <style>
    /* The editor's own colours (crates/heron-brush/src/theme.rs), light or dark as the
       system is, so the loader hands over to the editor without a flash. */
    :root { --bg: #eceef1; --fg: #1d2025; --dim: #5e646c; --track: #cdd1d6; --accent: #3d8bfd; --error: #c0392b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1b1c1f; --fg: #e4e6ea; --dim: #8b9199; --track: #2f3237; --error: #ef6b5b; }
    }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
    /* eframe sizes the canvas to its parent and sets its pixel size from the device's scale. */
    #heron-brush { display: block; width: 100%; height: 100%; touch-action: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 14px; background: var(--bg); color: var(--fg);
               font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; }
    #loading img { width: 72px; height: 72px; }
    #loading .name { font-size: 20px; font-weight: 600; }
    #loading .bar { width: 260px; max-width: 70vw; height: 4px; border-radius: 2px; background: var(--track);
                    overflow: hidden; margin-top: 6px; }
    #loading .fill { height: 100%; width: 0; border-radius: 2px; background: var(--accent); transition: width 0.15s; }
    /* Until the first progress arrives, a sliver sweeps the track. */
    #loading.waiting .fill { width: 30%; animation: sweep 1.2s ease-in-out infinite; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
    #loading .status { color: var(--dim); font-size: 13px; min-height: 1.3em; text-align: center; max-width: 80vw; }
    #loading.failed .status { color: var(--error); }
    #loading.failed .bar { display: none; }
  </style>
  <script>
    // How far the page has got, for loader.mjs, the bundled data (src/web_files.js) and
    // the start (heron-brush-web): a status line and, where known, a fraction of the way.
    window.heronLoading = (status, fraction, failed) => {
      const loading = document.getElementById("loading");
      if (!loading) return;
      loading.querySelector(".status").textContent = status;
      if (typeof fraction === "number") {
        loading.classList.remove("waiting");
        loading.querySelector(".fill").style.width = Math.round(Math.min(1, Math.max(0, fraction)) * 100) + "%";
      }
      loading.classList.toggle("failed", Boolean(failed));
    };
  </script>
</head>
<body>
  <canvas id="heron-brush"></canvas>
  <div id="loading" class="waiting">
    <img src="heron-brush.png" alt="">
    <div class="name">Heron Brush</div>
    <div class="bar"><div class="fill"></div></div>
    <div class="status">Loading</div>
  </div>
</body>
</html>
