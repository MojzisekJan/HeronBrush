[package]
name = "scene_export"
description = "Engine-neutral level export and engine-specific writers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
file_store = { path = "../file_store" }
data-encoding = "2"
glam = { version = "0.29", features = ["serde"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
imagesize = "0.13"
png = "0.18"
rayon = "1"
# FxHash for the geometry passes' grouping maps, as in `map_model`: the keys are little
# arrays of quantised integers, where SipHash showed up in the profile.
rustc-hash = "2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "export"
harness = false

[lints]
workspace = true
