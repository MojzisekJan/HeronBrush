        ({visuals,colliders,staticColliders,movingColliders,animations,triggers,animatedColliders,waters}=staged);
        data=next;level=next.level;staticWorld=nextStatic;movingWorld=nextMoving;
        applyEnvironment(level.environment);
        hasCollision=staticColliders.children.length+movingColliders.children.length>0;
        scene.remove(oldVisuals);scene.add(visuals);
        if(hadCollision!==hasCollision) {
          capsule.start.fromArray(saved.feet).y+=radius;capsule.end.fromArray(saved.feet).y+=height-radius;
          velocity.set(0,0,0);grounded=false;
        }
        spawnEntity=level.entities.find(e=>['info_player_start','info_player_deathmatch','player_start','fps_player'].includes(e.classname));
        refreshSpawn();
        const keep=resources(visuals),collisionKeep=resources(colliders);
        for(const geometry of collisionKeep.geometry) keep.geometry.add(geometry);
        for(const material of collisionKeep.materials) keep.materials.add(material);
        for(const [name,entry] of pictures) if(entry.uri===next.textures[name]) keep.textures.add(entry.texture);
        release(oldVisuals,keep);release(oldColliders,keep);trimCaches(next,keep);
        document.title=level.name+' · Playtest';document.getElementById('title').textContent=level.name;
        document.getElementById('level-data').textContent=JSON.stringify(next).replaceAll('<','\\u003c');
        metrics.lastUpdateMs=performance.now()-updateStarted;
        metrics.lastCollisionBuildMs=metrics.collisionBuildMs-collisionStarted;
        metrics.updates++;recordTimings();return true;
      } catch(error) {
        const keep=resources(visuals);for(const geometry of resources(colliders).geometry) keep.geometry.add(geometry);
        if(staged) release(staged.visuals,keep);trimCaches(data,keep);throw error;
      }
    });
    updateTail=job.catch(()=>{});return job;
  };
  if(parent!==window) {
    window.heronPlaytestSnapshot=snapshot;
    window.addEventListener('message',event=> {
      if(event.source!==parent || event.origin!==window.origin || event.data?.type!=='heron-restore') return;
      restore(event.data.state);
      parent.postMessage({type:'heron-state',state:snapshot()},window.origin);
    });
    parent.postMessage({type:'heron-ready'},window.origin);
  }
  metrics.initialAssemblyMs=performance.now()-sceneStarted;recordTimings();
  play.disabled = false;
  status.textContent = hasCollision ? 'Ready. Walk around the level with WASD and look with the mouse.' : 'No collision geometry. Fly with WASD, Space up and Ctrl down.';
  function start() {playing = true; menu.hidden = true; crosshair.hidden = false;}
  function pause() {
    playing = false; dragging = false; menu.hidden = false; crosshair.hidden = true;
    keys.clear(); velocity.set(0,0,0); play.textContent = 'Resume';
  }
  function captureFailed() {
    status.textContent = 'Mouse capture is unavailable in this browser. Use drag-to-look, or open the HTML in a desktop browser.';
    document.getElementById('fallback').hidden = false;
  }
  play.addEventListener('click', async () => {
    dragLook = false;
    try {await renderer.domElement.requestPointerLock();} catch (_) {captureFailed();}
  });
  document.getElementById('fallback').addEventListener('click', () => {
    dragLook = true; start();
    document.getElementById('hint').textContent = 'WASD · Drag mouse to look · Space jump · Shift run · R restart · Esc pause';
  });
  controls.addEventListener('lock', start);
  controls.addEventListener('unlock', pause);
  document.addEventListener('pointerlockerror', captureFailed);
  renderer.domElement.addEventListener('pointerdown', event => {
    if (playing && dragLook) {dragging = true; renderer.domElement.setPointerCapture(event.pointerId);}
  });
  renderer.domElement.addEventListener('pointerup', () => {dragging = false;});
  renderer.domElement.addEventListener('pointermove', event => {
    if (!playing || !dragLook || !dragging) return;
    camera.rotation.y -= event.movementX * 0.002;
    camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x - event.movementY * 0.002, -1.55, 1.55);
  });
  const movementKeys = new Set(['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ShiftRight','ControlLeft','KeyR']);
  document.addEventListener('keydown', event => {
    if (event.code === 'Escape') {pause(); controls.unlock(); return;}
    if (!playing || !movementKeys.has(event.code)) return;
    event.preventDefault();
    if (event.code === 'KeyR') reset(); else keys.add(event.code);
  });
  document.addEventListener('keyup', event => keys.delete(event.code));
  window.addEventListener('blur', () => {pause(); controls.unlock();});
  document.addEventListener('visibilitychange', () => {if (document.hidden) {pause(); controls.unlock();}});
  window.addEventListener('resize', () => {camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);});
  let previous = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min((now - previous) / 1000, 0.05);
    previous = now;
    if (playing) {
      // Keep each movement shorter than half the capsule radius, even during a fall.
      const steps = Math.max(5, Math.ceil((velocity.length() + 240 * unit) * dt / (radius * 0.5)));
      for (let i = 0; i < steps; i++) step(dt / steps);
    }
    for(const water of waters)water.animate(now/1000);
    const underwater=HeronWater.sample(waters,camera.position);
    if(underwater){const d=underwater.data;scene.fog=new THREE.FogExp2(new THREE.Color(...d.color),d.fog_density);}else scene.fog=baseFog;
    renderer.render(scene, camera);
  });
} catch (error) { window.playerError(error); }
</script>
</body>
</html>
