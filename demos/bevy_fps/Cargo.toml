[package]
name = "heron_brush-bevy-demo"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Its own workspace: bevy pulls in several hundred crates and none of them
# belong in heron_brush's lock file.
[workspace]
resolver = "2"

[dependencies]
# Bevy's own "3d" and "ui" feature sets, minus three things this has no use
# for and which each want a Linux development package that a level viewer
# should not make you install: audio (ALSA), gamepads (libudev), and the
# clipboard. What is left is spelled out because those two sets pull the rest
# of it in wholesale.
bevy = { version = "0.19", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "custom_cursor",
    "default_font",
    "3d_bevy_render",
    "scene",
    "picking",
    "ui_api",
    "ui_bevy_render",
    "bevy_ui_widgets",
    "free_camera",
] }
avian3d = { version = "0.7", default-features = false, features = ["3d", "f32", "parry-f32", "collider-from-mesh", "parallel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Not used here. Bevy 0.19 turns on winit's wayland support by default, which
# links libwayland at build time and wants its development package. This asks
# winit to dlopen it instead, so the demo builds on a machine that only has
# the runtime library, and still runs under both X11 and Wayland.
winit = { version = "0.30", features = ["wayland-dlopen"] }

[dev-dependencies]
# Read the real exported collision primitives in the headless motion_lab check.
gltf = { version = "1.4", default-features = false, features = ["utils"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
