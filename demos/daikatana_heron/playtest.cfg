// A scripted walk through heron_marsh in the Yamagi Quake II Remaster viewer:
// run-yq2remaster +map heron_marsh +exec playtest.cfg
// The viewer runs Quake 2's game code on the Daikatana map, so the doors, buttons,
// triggers and switchable lights work as Quake 2 has them and Daikatana's monsters
// and items mostly do not spawn. Each step echoes a PLAYTEST line and the view
// position and takes a screenshot. teleport (a Yamagi cheat, allowed in single
// player) puts the player at each step facing east.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w100
god
echo PLAYTEST 1 spawn
viewpos
screenshot
// The button is on the hall's east wall, north of the door.
teleport 440 336 0
w25
+forward
w25;w25
-forward
w100
// Back in the middle of the hall, looking at the open door.
teleport 300 256 0
w100
echo PLAYTEST 2 button pressed
viewpos
screenshot
// East through the door and the trigger, then back to the courtyard's west end. The
// viewer's frames are short, so a timed walk goes a long way.
teleport 460 256 0
w25
+forward
w25
-forward
w25
teleport 624 256 0
w100
echo PLAYTEST 3 courtyard
viewpos
screenshot
// On the platform, at the exit.
teleport 1040 256 64
w100
echo PLAYTEST 4 platform
viewpos
screenshot
