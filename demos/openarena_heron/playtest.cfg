// Play-tests heron_court: run after +devmap heron_court (setviewpos is a cheat).
// Each wait is one frame and com_maxfps holds the frames near 30 a second. Every step
// prints PLAYTEST and viewpos to the console and takes a screenshot, which lands in
// baseoa/screenshots under the home path. The screenshot is taken at the end of a later
// frame, so a few frames pass before the next command moves the player.
set com_maxfps 30
set cg_drawFPS 1
wait 90
// God mode keeps the player standing once the bots are in.
god
echo PLAYTEST spawn
viewpos
screenshotJPEG
wait 5

// The yard from the south-west corner.
setviewpos -560 -440 60 35
wait 30
echo PLAYTEST yard
screenshotJPEG
wait 5

// Onto the jump pad: the trigger_push should throw the player onto the ledge.
setviewpos 0 96 40 90
wait 15
echo PLAYTEST in the air
viewpos
wait 75
echo PLAYTEST after the jump pad
viewpos
screenshotJPEG
wait 5

// The jump pad from the yard.
setviewpos -200 -100 40 60
wait 30
echo PLAYTEST jump pad
screenshotJPEG
wait 5

// Into the teleporter at the far end of the room: out on the ledge, facing east.
setviewpos 0 -560 40 270
wait 30
echo PLAYTEST room
screenshotJPEG
wait 5
setviewpos 0 -832 40 270
wait 30
echo PLAYTEST after the teleporter
viewpos
screenshotJPEG
wait 5

// Bots, to see that the .aas works and that they find their way about.
addbot sarge 2
addbot grism 2
addbot kyonshi 2
wait 600
echo PLAYTEST bots
setviewpos 560 448 190 225
wait 20
screenshotJPEG
wait 5
wait 300
setviewpos -560 448 190 315
wait 20
echo PLAYTEST bots later
screenshotJPEG
wait 5
echo PLAYTEST done
quit
