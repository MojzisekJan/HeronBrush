// The teleporter: +map heron_outpost +exec teleporter.cfg
// Puts the player beside the pad in the hall's north-west corner and steps onto it.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w100
god
teleport 64 384 0
w25
echo PLAYTEST T1 by the pad
viewpos
+moveleft
w25
-moveleft
w100
echo PLAYTEST T2 after the pad
viewpos
screenshot
