// A scripted walk through heron_outpost: +map heron_outpost +exec playtest.cfg
// Each step echoes a PLAYTEST line and the view position to the console and takes a
// screenshot. teleport (a Yamagi cheat, allowed in single player) puts the player at
// each step and faces them east, so the walks between are short.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w100
god
echo PLAYTEST 1 spawn
viewpos
screenshot
// The button is on the hall's east wall, north of the door.
teleport 440 336 0
w25
+forward
w25;w25
-forward
w100
// Back in the middle of the hall, looking at the door.
teleport 300 256 0
w100
echo PLAYTEST 2 button pressed
viewpos
screenshot
// In front of the open door, then east through it and the trigger.
teleport 460 256 0
w25
+forward
w25;w5;w5
-forward
w100
echo PLAYTEST 3 courtyard
viewpos
listentities monsters
screenshot
// On the platform, past the guards, then into the exit. Nothing may be left waiting
// in the command buffer after that: the changelevel's command queues behind it, and
// the exit trigger keeps firing while the player stands in it.
teleport 1024 256 64
w100
echo PLAYTEST 4 platform
viewpos
screenshot
+forward
