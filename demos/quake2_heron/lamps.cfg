// The courtyard lamps: +map heron_outpost +exec lamps.cfg
// Looks along the courtyard's south wall with the lamps off, steps into the doorway
// trigger, and looks again from the same place.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w100
god
notarget
teleport 640 -16 0
w100
echo PLAYTEST L1 lamps off
screenshot
teleport 576 256 0
w100
teleport 640 -16 0
w100
echo PLAYTEST L2 lamps on
screenshot
