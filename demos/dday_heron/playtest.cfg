// A scripted round on heron_hedgerow: +set deathmatch 1 +map heron_hedgerow +exec playtest.cfg
// Joins a team through the game's own menus (invuse picks the highlighted line, invnext
// moves down), spawns as infantry in the gap of the Allies' wall, walks east up the
// bunker's ramp onto its roof, which takes the objective, and takes a screenshot at each
// step. Each step echoes a PLAYTEST line to the console log. q2pro's wait takes a
// count of frames; nested aliases of waits stop with "Runaway alias loop".
wait 100
echo PLAYTEST 1 main menu
screenshot
// Main menu: Join The Game.
invuse
wait 25
echo PLAYTEST 2 team menu
screenshot
// Team menu: the first line is Auto Select, the next one the Allies.
invnext
invuse
wait 25
echo PLAYTEST 3 class menu
screenshot
// Class menu: the first line is infantry. The game puts the player in at the next
// reinforcement wave, which the number at the bottom counts down to (up to 10 s).
invuse
wait 1200
echo PLAYTEST 4 spawned
screenshot
+forward
wait 150
echo PLAYTEST 5 walking
screenshot
wait 90
-forward
wait 25
echo PLAYTEST 6 on the bunker
screenshot
wait 100
echo PLAYTEST 7 after
screenshot
