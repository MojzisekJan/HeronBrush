// A scripted walk through heron_lab and, after the level change, heron_lab2. Start
// the engine with
//     +sv_cheats 1 +sv_enttools_enable 1 +map heron_lab
// and, once the map is up, run "exec playtest.cfg" from the console with the console
// closed straight after (console.py does both), since the player does not move while
// the console is open.
// host_framerate 0.02 makes every frame 1/50 s, so a key held for a number of waits
// moves the player the same distance on every run. Each step echoes a PLAYTEST line,
// prints the player's or the door's state with ent_info and takes a screenshot.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
host_framerate 0.02
god
notarget
cl_showpos 1
w25
echo PLAYTEST 1 spawn
ent_info 1
screenshot
// East to the closed door, then north along the wall until the button stops the player.
+forward
w25;w25;w25
-forward
+moveleft
w25;w25
-moveleft
w25
// The button is up and to the left: turn towards it (cl_yawspeed is 210 a second, so 16
// frames are 67 degrees) and press it.
+left
w5;w5;w5;wait
-left
w5
echo PLAYTEST 2 at the button
ent_info 1
screenshot
+use
w5
-use
w100
echo PLAYTEST 3 button pressed
ent_info door1
+right
w5;w5;w5;wait
-right
// A step back, to see the door up.
+back
w5;w5
-back
w25
screenshot
// Back to the wall beside the door.
+forward
w25
-forward
w5
// Forward and to the right into the doorway: the passage behind it holds the player
// against its south wall, which is the line the rest of the walk follows. The trigger
// in the passage switches the lamp on and sends in the houndeyes.
+forward
+moveright
w25
-moveright
w5;w5
-forward
w25
echo PLAYTEST 4 yard
ent_info 1
screenshot
w100
echo PLAYTEST 5 houndeyes
ent_list monster_houndeye
w100
// Up the ramp onto the platform, in front of the corridor.
+forward
w25;w5;w5;w5;w5
-forward
w25
echo PLAYTEST 6 platform
ent_info 1
screenshot
// Into the corridor and its trigger_changelevel. The rest of this file runs on in
// heron_lab2 once it has loaded.
+forward
w25;w25
-forward
w100
echo PLAYTEST 7 arrived in heron_lab2
ent_info 1
screenshot
// East through the rotating door, which opens as the player walks into it.
+forward
w25;w25
-forward
w25
echo PLAYTEST 8 room
ent_info 1
screenshot
// Into the trigger_endsection, which ends the demo and drops back to the menu.
+forward
w100
-forward
