// A scripted walk through libre_lift: +map libre_lift +exec playtest.cfg
// Each step echoes a PLAYTEST line to the console (and qconsole.log with -condebug)
// and takes a screenshot. setpos turns noclip on, so each one turns it off again.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w100
god
echo PLAYTEST 1 spawn
screenshot png
// Walk into the button beside the door.
setpos 460 336 24 0 0 0
noclip
+forward
w25
-forward
w100
w100
setpos 300 256 24 0 0 0
noclip
w25
echo PLAYTEST 2 door open
screenshot png
// From here the player only walks east: through the door and the trigger (the ambush
// wakes and its light comes on), onto the lowered lift, which rises to the ledge, and on
// into the exit.
setpos 300 256 24 0 0 0
noclip
+forward
w25
echo PLAYTEST 3 walking
screenshot png
w25
w5
echo PLAYTEST 4 arena
screenshot png
w25
echo PLAYTEST 5 lift
screenshot png
w25
echo PLAYTEST 6 ledge
screenshot png
w100
w100
-forward
echo PLAYTEST 7 exit
screenshot png
w25
quit
