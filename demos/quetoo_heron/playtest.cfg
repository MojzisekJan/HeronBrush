// The game side of playtest.py. J shows the diagnostics, whose first rows are the
// player's origin and speed, K takes a screenshot and L hides the diagnostics again,
// since they slow a software renderer down. O marks the log, U kills the player and I
// is attack, which respawns it.
set cg_drawDiagnostics 0
bind i +attack
bind j "set cg_drawDiagnostics 1"
bind k r_screenshot
bind l "set cg_drawDiagnostics 0"
bind o "echo PLAYTEST mark"
bind u kill
// The mouse is not used: in a nested X server the pointer drifts and turns the view.
set m_sensitivity 0
