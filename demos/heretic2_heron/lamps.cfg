// Looks along the yard before and after the trigger: +map heron_wharf +exec lamps.cfg
// teleport does not touch triggers on the way, so the first look is with the lamps
// off; standing in the doorway then fires the trigger and the lamps come on.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w100
god
notarget
teleport 680 256 40
w100
echo LAMPS before
screenshot
teleport 576 256 40
w100
teleport 680 256 40
w100
echo LAMPS after
screenshot
