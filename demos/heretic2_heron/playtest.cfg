// A scripted walk through heron_wharf: +map heron_wharf +exec playtest.cfg
// Each step echoes a PLAYTEST line and the view position to the console and takes a
// screenshot. teleport (a cheat the port's game code keeps, allowed in single player)
// puts the player at each step facing east, so the walks between are short.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w100
god
echo PLAYTEST 1 spawn
viewpos
screenshot
// The button is on the warehouse's east wall, north of the door.
teleport 440 336 40
w25
+forward
w25;w25
-forward
w100
// Back in the middle of the warehouse, looking at the door.
teleport 300 256 40
w100
echo PLAYTEST 2 button pressed
viewpos
screenshot
// In front of the open door, then east through it and the trigger.
teleport 460 256 40
w25
+forward
w25;w25
-forward
w100
echo PLAYTEST 3 yard
viewpos
listentities monsters
screenshot
// On the quay, past the elves, then into the exit. Nothing may be left waiting in the
// command buffer after that: the changelevel's command queues behind it, and the exit
// trigger keeps firing while the player stands in it.
teleport 1024 256 104
w100
echo PLAYTEST 4 quay
viewpos
screenshot
+forward
