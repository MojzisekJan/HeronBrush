// A scripted walk through heron_keep: +map heron_keep +exec playtest.cfg
// Each step echoes a PLAYTEST line and its position to the console (and to stdout) and
// takes a screenshot. host_framerate makes every frame 1/50 s, so a key held for so
// many waits moves the player the same distance on every run.
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w100
god
host_framerate 0.02
echo PLAYTEST 1 spawn
viewpos
screenshot
// The button is straight ahead, on the wall beside the door.
+forward
w100
w25
-forward
w100
echo PLAYTEST 2 button pressed
edict 32
viewpos
screenshot
// Step right in front of the open door, then walk east: through the door and the
// trigger (the ambush wakes, its light comes up), up the steps and into the exit.
+moveright
w5;w5;wait;wait;wait;wait
-moveright
w25
echo PLAYTEST 3 at the door
viewpos
screenshot
+forward
w25;w5;w5
echo PLAYTEST 4 chapel
viewpos
screenshot
w25;w5
echo PLAYTEST 5 steps
viewpos
screenshot
w25;w25
echo PLAYTEST 6 dais
viewpos
screenshot
w100
-forward
echo PLAYTEST 7 exit
viewpos
w100
screenshot
w100
quit
