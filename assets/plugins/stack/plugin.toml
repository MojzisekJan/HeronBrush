# A plugin that asks before it runs. Each [[setting]] becomes a control in the Plugins
# window, and the script reads the answer back with setting("<key>").

name = "Stack"
description = "Copy each selected brush straight up, for a column or a rough staircase."
version = "1.1"
api = 1

[[setting]]
key = "copies"
label = "Copies"
kind = "number"
default = 5
min = 1
max = 200

[[setting]]
key = "spacing"
label = "Gap between copies"
kind = "number"
default = 0
min = -1024
max = 1024

[[setting]]
key = "direction"
label = "Direction"
kind = "choice"
choices = "up, down"
default = "up"
