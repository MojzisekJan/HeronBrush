name = "Selection inspector"
description = "Inspect brush counts and move the selection with a configurable step."
version = "1.0"
api = 1
panel_action = "inspect"

[[setting]]
key = "step"
label = "Step (map units)"
kind = "number"
default = 16
min = 1
max = 256

[[action]]
id = "inspect"
label = "Inspect selection"
description = "Show brush and face counts without changing the map."

[[action]]
id = "raise"
label = "Move up"

[[action]]
id = "lower"
label = "Move down"
