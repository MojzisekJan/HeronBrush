// General Heron Brush editing profile. Export engines are configured separately.
{
    "version": 9,
    "name": "heron_brush",
    "icon": "Icon.png",
    "fileformats": [
        { "format": "Valve", "initialmap": "initial_valve.map" },
        { "format": "Quake3 (Valve)" },
        { "format": "Standard" }
    ],
    "filesystem": {
        "searchpath": ".",
        "packageformat": { "extension": ".zip", "format": "zip" }
    },
    "materials": {
        "root": "textures",
        "extensions": [".png", ".jpg", ".jpeg", ".bmp", ".tga", ".webp"],
        "excludes": [
            "*_normal", "*_roughness", "*_metallic", "*_emission",
            "*_ao", "*_orm", "*_height", "*_sss"
        ],
        "attribute": "wad"
    },
    "entities": {
        "definitions": [ "heron_brush.fgd" ],
        "defaultcolor": "0.6 0.6 0.6 1.0",
        "setDefaultProperties": true,
        "scale": "32"
    },
    "tags": {
        "brush": [
            {
                "name": "Trigger",
                "attribs": [ "transparent" ],
                "match": "classname",
                "pattern": "trigger_*",
                "material": "clip"
            }
        ],
        "brushface": [
            { "name": "Clip",   "attribs": [ "transparent" ], "match": "material", "pattern": "clip" },
            { "name": "Skip",   "attribs": [ "transparent" ], "match": "material", "pattern": "skip" },
            { "name": "Origin", "attribs": [ "transparent" ], "match": "material", "pattern": "origin" }
        ]
    },
    "faceattribs": {
        "defaults": {
            "scale": [ 1.0, 1.0 ]
        },
        "contentflags": [],
        "surfaceflags": []
    }
}
