// Runtime for the validated _heron_animation payload. Supply Three.js and the
// exported entity root. Collision adapters must use that same root's pose.
class HeronAnimation {
  constructor(THREE, json, object) {
    this.THREE = THREE;
    this.data = typeof json === 'string' ? JSON.parse(json) : json;
    const d = this.data;
    if (d.version !== 1 || !Number.isFinite(d.scale) || d.scale <= 0 ||
        !d.clips?.length || d.clips.some(c => c.channels.length !== 6 || !Number.isFinite(c.duration) || c.duration <= 0)) {
      throw new Error('Invalid animation payload');
    }
    this.clip = d.clips.find(c => c.name === d.selected);
    if (!this.clip) throw new Error('Missing selected clip');
    this.object = object;
    this.rest = {position: object.position.clone(), rotation: object.quaternion.clone(), scale: object.scale.clone()};
    this.time = 0;
    this.playing = d.autoplay;
    this.posed = this.playing;
  }
  play(name) {
    const clip = this.data.clips.find(c => c.name === name);
    if (!clip) return false;
    this.clip = clip; this.time = 0; this.playing = this.posed = true;
    return true;
  }
  activate() {
    if (['open', 'close'].every(n => this.data.clips.some(c => c.name === n))) {
      const phase = Math.min(this.time / this.clip.duration, 1);
      const reverse = this.playing && this.posed;
      const next = this.clip.name === 'open' && this.posed ? 'close' : 'open';
      this.play(next);
      if (reverse) this.time = (1 - phase) * this.clip.duration;
    } else this.play(this.data.selected);
  }
  pause() { this.playing = false; }
  resume() { this.playing = this.posed = true; }
  stop() { this.playing = this.posed = false; this.time = 0; }
  seek(seconds) { if (Number.isFinite(seconds)) { this.time = Math.max(seconds, 0); this.posed = true; } }
  update(dt) {
    if (!Number.isFinite(dt) || dt < 0) throw new Error('Invalid animation timestep');
    const c = this.clip;
    if (this.playing) {
      this.time += dt;
      if (c.mode === 'once' && this.time >= c.duration) { this.time = c.duration; this.playing = false; }
      else if (c.mode !== 'once') this.time %= c.duration * (c.mode === 'pingpong' ? 2 : 1);

    let time = c.mode === 'once' ? Math.min(this.time, c.duration) : this.time % (c.duration * (c.mode === 'pingpong' ? 2 : 1));
    if (time > c.duration) time = 2 * c.duration - time;

function sample(keys, time) {
  if (!keys.length) return 0;
  if (time <= keys[0].time) return keys[0].value;
  let index = 0;
  while (index + 1 < keys.length && keys[index + 1].time <= time) index++;

  if (a.interpolation === 'bezier') return u*u*u*a.value + 3*u*u*f*(a.value+a.outgoing*duration/3) +

}

class HeronAnimationTrigger {
  constructor(json, object) {

        case 'open': case 'close': animation.play(d.action); break;
        case 'pause': animation.pause(); break;
        case 'resume': animation.resume(); break;
        case 'stop': animation.stop(); break;
        case '': case 'toggle': animation.activate(); break;
      }

  }
}

            material.emissive.setRGB(1, 1, 1);
            material.emissiveMap = material.map;
            material.emissiveIntensity = surface[2];
          }
          material.needsUpdate = true;
        }
      });
      root.add(gltf.scene);
    }
    const collision = entity.collision;
    if (!collision || collision.sensor) continue;
    const group = transform(new THREE.Group(), entity);
    if (collision.triangles?.length) {
      group.add(new THREE.Mesh(trianglesGeometry(collision.triangles)));
    }
    for (const hull of collision.hulls || []) {
      const points = [];
      for (let i = 0; i < hull.length; i += 3) points.push(new THREE.Vector3().fromArray(hull, i));
      if (points.length >= 4) group.add(new THREE.Mesh(new ConvexGeometry(points)));
    }
    (animationData ? movingColliders : staticColliders).add(group);
    if (animationData) animatedColliders.push({root, group});
  }
  colliders.updateMatrixWorld(true);
  function collisionTree(group) {
    const tree = new Octree();
    // Octree pads only its minimum bound. A moving top face can round outside
    // its maximum bound and disappear from the broadphase. Pad both sides;
    // the triangles themselves keep their exact exported coordinates.
    tree.calcBox = function() {
      Octree.prototype.calcBox.call(this);
      this.box.expandByScalar(1e-5);
      return this;
    };
    return tree.fromGraphNode(group);
  }
  const staticWorld = collisionTree(staticColliders);
  let movingWorld = collisionTree(movingColliders);
  const world = {
    rayIntersect(ray) {
      const a = staticWorld.rayIntersect(ray), b = movingWorld.rayIntersect(ray);
      return !a ? b : !b || a.distance <= b.distance ? a : b;
    },
    capsuleIntersect(capsule) {
      const a = staticWorld.capsuleIntersect(capsule), b = movingWorld.capsuleIntersect(capsule);
      return !a ? b : !b || a.depth >= b.depth ? a : b;
    }
  };
  const hasCollision = staticColliders.children.length + movingColliders.children.length > 0;
  // Quake-sized player: 56 units high, 16 units wide. Scale follows the export.
  const unit = 1 / level.scale;
  const radius = 8 * unit, height = 56 * unit, eye = 50 * unit;
  const capsule = new Capsule(new THREE.Vector3(), new THREE.Vector3(), radius);
  const bounds = new THREE.Box3().setFromObject(visuals);
  if (bounds.isEmpty()) bounds.set(new THREE.Vector3(-2, 0, -2), new THREE.Vector3(2, 0, 2));
  const spawnEntity = level.entities.find(e => ['info_player_start', 'info_player_deathmatch', 'player_start', 'fps_player'].includes(e.classname));
  const spawn = new THREE.Vector3();
  if (spawnEntity) {
    spawn.fromArray(spawnEntity.transform.translation);
    // A Quake player origin is at the centre of its bounding box.
    const floor = world.rayIntersect(new THREE.Ray(spawn.clone(), new THREE.Vector3(0, -1, 0)));
    if (floor && floor.distance < height * 2) spawn.y = floor.position.y + 0.02 * unit;
  } else {
    bounds.getCenter(spawn);
    spawn.y = bounds.max.y + height;
    const floor = world.rayIntersect(new THREE.Ray(spawn.clone(), new THREE.Vector3(0, -1, 0)));
    if (floor) spawn.y = floor.position.y + 0.02 * unit;
  }
  let grounded = false;
  function reset() {
    capsule.start.copy(spawn).y += radius;
    capsule.end.copy(spawn).y += height - radius;
    velocity.set(0, 0, 0);
    grounded = false;
    keys.clear();
    camera.rotation.set(...(spawnEntity?.transform.rotation_yxz || [0, 0, 0]), 'YXZ');
    camera.position.copy(capsule.start).y += eye - radius;
  }
  reset();
  const forward = new THREE.Vector3(), right = new THREE.Vector3(), wish = new THREE.Vector3();
  const up = new THREE.Vector3(0, 1, 0);
  function step(dt) {
    const wasGrounded = grounded;
    const feet = capsule.start.clone().addScaledVector(THREE.Object3D.DEFAULT_UP, -radius);
    for (const trigger of triggers) trigger.update(dt, new Map([['player', feet]]), animations);
    let support = null;
    if (grounded && !keys.has('Space')) {
      const ray = new THREE.Raycaster(feet.clone().add(new THREE.Vector3(0, radius, 0)), new THREE.Vector3(0,-1,0), 0, radius + 0.05);
      const hit = ray.intersectObject(colliders, true)[0];
      let object = hit?.object;
      while (object && !support) {
        support = animatedColliders.find(pair => pair.group === object);
        object = object.parent;
      }
    }
    const oldSupport = support?.group.matrixWorld.clone();
    for (const animation of animations.values()) animation.update(dt);
    if (animatedColliders.length) {
      visuals.updateMatrixWorld(true);
      for (const {root, group} of animatedColliders) {
        group.position.copy(root.position); group.quaternion.copy(root.quaternion); group.scale.copy(root.scale);
      }
      colliders.updateMatrixWorld(true);
      if (support) {
        const delta = new THREE.Matrix4().multiplyMatrices(support.group.matrixWorld, oldSupport.invert());
        capsule.start.applyMatrix4(delta); capsule.end.applyMatrix4(delta);
      }
      movingWorld = collisionTree(movingColliders);
    }
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();
    right.crossVectors(forward, up);
    wish.set(0, 0, 0);
    if (keys.has('KeyW')) wish.add(forward);
    if (keys.has('KeyS')) wish.sub(forward);
    if (keys.has('KeyD')) wish.add(right);
    if (keys.has('KeyA')) wish.sub(right);
    const speed = (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 240 : 150) * unit;
    wish.normalize().multiplyScalar(speed);
    const blend = 1 - Math.exp(-14 * dt);
    velocity.x += (wish.x - velocity.x) * blend;
    velocity.z += (wish.z - velocity.z) * blend;
    if (hasCollision) {
      if (grounded && keys.has('Space')) {velocity.y = 230 * unit; grounded = false; keys.delete('Space');}
      velocity.y = Math.max(velocity.y - 600 * unit * dt, -900 * unit);
    } else {
      velocity.y = ((keys.has('Space') ? 1 : 0) - (keys.has('ControlLeft') ? 1 : 0)) * speed;
    }
    capsule.translate(velocity.clone().multiplyScalar(dt));
    grounded = false;
    for (let i = 0; i < 4; i++) {
      const hit = world.capsuleIntersect(capsule);
      if (!hit) break;
      grounded ||= hit.normal.y > 0.5;
      const inward = velocity.dot(hit.normal);
      if (inward < 0) velocity.addScaledVector(hit.normal, -inward);
      capsule.translate(hit.normal.multiplyScalar(hit.depth + 0.001 * unit));
    }
    if (capsule.start.y < bounds.min.y - height * 10) reset();
    if (window.heronPlaytest) window.heronPlaytest.diagnostic = {wasGrounded, support: !!support,
      floor: world.rayIntersect(new THREE.Ray(capsule.start.clone(), new THREE.Vector3(0,-1,0)))?.distance};
    camera.position.copy(capsule.start).y += eye - radius;
  }
  // Opt-in inspection for the native browser regression, using the same player
  // step and collision geometry as interactive play.
  if (new URLSearchParams(location.search).has('verify')) {
    window.heronPlaytest = {step, reset, capsule, animations, triggers, keys, colliders, world, velocity,
      get grounded() {return grounded;},
      teleport(feet) {
        capsule.start.copy(feet).y += radius;
        capsule.end.copy(feet).y += height - radius;
        velocity.set(0,0,0); grounded = false; keys.clear();
      },
      feet() {return capsule.start.clone().add(new THREE.Vector3(0,-radius,0));},
      face(yaw) {camera.rotation.set(0,yaw,0,'YXZ');},
      THREE};
  }
  play.disabled = false;
  status.textContent = hasCollision ? 'Ready. Walk around the level with WASD and look with the mouse.' : 'No collision geometry. Fly with WASD, Space up and Ctrl down.';
  function start() {playing = true; menu.hidden = true; crosshair.hidden = false;}
  function pause() {
    playing = false; dragging = false; menu.hidden = false; crosshair.hidden = true;
    keys.clear(); velocity.set(0,0,0); play.textContent = 'Resume';
  }
  function captureFailed() {
    status.textContent = 'Mouse capture is unavailable in this browser. Use drag-to-look, or open the HTML in a desktop browser.';
    document.getElementById('fallback').hidden = false;
  }
  play.addEventListener('click', async () => {
    dragLook = false;
    try {await renderer.domElement.requestPointerLock();} catch (_) {captureFailed();}
  });
  document.getElementById('fallback').addEventListener('click', () => {
    dragLook = true; start();
    document.getElementById('hint').textContent = 'WASD · Drag mouse to look · Space jump · Shift run · R restart · Esc pause';
  });
  controls.addEventListener('lock', start);
  controls.addEventListener('unlock', pause);
  document.addEventListener('pointerlockerror', captureFailed);
  renderer.domElement.addEventListener('pointerdown', event => {
    if (playing && dragLook) {dragging = true; renderer.domElement.setPointerCapture(event.pointerId);}
  });
  renderer.domElement.addEventListener('pointerup', () => {dragging = false;});
  renderer.domElement.addEventListener('pointermove', event => {
    if (!playing || !dragLook || !dragging) return;
    camera.rotation.y -= event.movementX * 0.002;
    camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x - event.movementY * 0.002, -1.55, 1.55);
  });
  const movementKeys = new Set(['KeyW','KeyA','KeyS','KeyD','Space','ShiftLeft','ShiftRight','ControlLeft','KeyR']);
  document.addEventListener('keydown', event => {
    if (event.code === 'Escape') {pause(); controls.unlock(); return;}
    if (!playing || !movementKeys.has(event.code)) return;
    event.preventDefault();
    if (event.code === 'KeyR') reset(); else keys.add(event.code);
  });
  document.addEventListener('keyup', event => keys.delete(event.code));
  window.addEventListener('blur', () => {pause(); controls.unlock();});
  document.addEventListener('visibilitychange', () => {if (document.hidden) {pause(); controls.unlock();}});
  window.addEventListener('resize', () => {camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);});
  let previous = performance.now();
  renderer.setAnimationLoop(now => {
    const dt = Math.min((now - previous) / 1000, 0.05);
    previous = now;
    if (playing) {
      // Keep each movement shorter than half the capsule radius, even during a fall.
      const steps = Math.max(5, Math.ceil((velocity.length() + 240 * unit) * dt / (radius * 0.5)));
      for (let i = 0; i < steps; i++) step(dt / steps);
    }
    renderer.render(scene, camera);
  });
} catch (error) { window.playerError(error); }
</script>
</body>
</html>
